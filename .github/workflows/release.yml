name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21" # 注意：Go 1.24.1 还未发布，使用 1.21

      - name: Install cross-compilation dependencies
        run: |
          # 安装交叉编译所需的 GCC
          sudo apt-get update
          sudo apt-get install -y gcc-multilib gcc-mingw-w64
          # 注意：启动器只支持 Windows 版本，不需要安装 Linux GUI 库

      - name: Get dependencies
        run: go mod download

      - name: Build for Windows and Linux (64-bit and 32-bit)
        run: |
          APP_NAME="evm-grid-bot"
          VERSION=${{ github.ref_name }}

          echo "开始构建 ${APP_NAME} 版本 ${VERSION}"

          # Linux AMD64 (64位) - 启用 CGO
          echo "构建 Linux AMD64..."
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -ldflags="-X main.version=${VERSION}" -o ${APP_NAME}-linux-amd64 .

          # Linux 386 (32位) - 启用 CGO
          echo "构建 Linux 386..."
          CGO_ENABLED=1 GOOS=linux GOARCH=386 go build -ldflags="-X main.version=${VERSION}" -o ${APP_NAME}-linux-386 .

          # Windows AMD64 (64位) - 启用 CGO
          echo "构建 Windows AMD64..."
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 CC=x86_64-w64-mingw32-gcc go build -ldflags="-X main.version=${VERSION}" -o ${APP_NAME}-windows-amd64.exe .

          # Windows 386 (32位) - 启用 CGO
          echo "构建 Windows 386..."
          CGO_ENABLED=1 GOOS=windows GOARCH=386 CC=i686-w64-mingw32-gcc go build -ldflags="-X main.version=${VERSION}" -o ${APP_NAME}-windows-386.exe .

          echo "构建完成，文件列表："
          ls -la ${APP_NAME}-*

      - name: Build Launcher for Windows (64-bit and 32-bit)
        run: |
          LAUNCHER_NAME="launcher"
          VERSION=${{ github.ref_name }}

          echo "开始构建 ${LAUNCHER_NAME} 版本 ${VERSION}"

          # Windows AMD64 (64位) - Fyne 需要 CGO
          echo "构建 Launcher Windows AMD64..."
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 CC=x86_64-w64-mingw32-gcc go build -ldflags="-X main.version=${VERSION}" -o ${LAUNCHER_NAME}-windows-amd64.exe ./cmd/launcher

          # Windows 386 (32位) - Fyne 需要 CGO
          echo "构建 Launcher Windows 386..."
          CGO_ENABLED=1 GOOS=windows GOARCH=386 CC=i686-w64-mingw32-gcc go build -ldflags="-X main.version=${VERSION}" -o ${LAUNCHER_NAME}-windows-386.exe ./cmd/launcher

          echo "Launcher 构建完成，文件列表："
          ls -la ${LAUNCHER_NAME}-*

      - name: Create release packages
        run: |
          APP_NAME="evm-grid-bot"
          VERSION=${{ github.ref_name }}

          echo "创建发布包..."

          # Linux AMD64 包 - 创建顶级目录结构
          echo "打包 Linux AMD64..."
          LINUX_AMD64_DIR="${APP_NAME}-${VERSION}-linux-amd64"
          mkdir -p ${LINUX_AMD64_DIR}/etc
          cp ${APP_NAME}-linux-amd64 ${LINUX_AMD64_DIR}/${APP_NAME}
          cp etc/config.yaml.sample ${LINUX_AMD64_DIR}/etc/config.yaml
          cp README.md ${LINUX_AMD64_DIR}/ 2>/dev/null || true
          tar -czf ${LINUX_AMD64_DIR}.tar.gz ${LINUX_AMD64_DIR}

          # Linux 386 包 - 创建顶级目录结构
          echo "打包 Linux 386..."
          LINUX_386_DIR="${APP_NAME}-${VERSION}-linux-386"
          mkdir -p ${LINUX_386_DIR}/etc
          cp ${APP_NAME}-linux-386 ${LINUX_386_DIR}/${APP_NAME}
          cp etc/config.yaml.sample ${LINUX_386_DIR}/etc/config.yaml
          cp README.md ${LINUX_386_DIR}/ 2>/dev/null || true
          tar -czf ${LINUX_386_DIR}.tar.gz ${LINUX_386_DIR}

          # Windows AMD64 包 - 创建顶级目录结构
          echo "打包 Windows AMD64..."
          WINDOWS_AMD64_DIR="${APP_NAME}-${VERSION}-windows-amd64"
          mkdir -p ${WINDOWS_AMD64_DIR}/etc
          cp ${APP_NAME}-windows-amd64.exe ${WINDOWS_AMD64_DIR}/${APP_NAME}.exe
          cp etc/config.yaml.sample ${WINDOWS_AMD64_DIR}/etc/config.yaml
          cp README.md ${WINDOWS_AMD64_DIR}/ 2>/dev/null || true
          zip -r ${WINDOWS_AMD64_DIR}.zip ${WINDOWS_AMD64_DIR}

          # Windows 386 包 - 创建顶级目录结构
          echo "打包 Windows 386..."
          WINDOWS_386_DIR="${APP_NAME}-${VERSION}-windows-386"
          mkdir -p ${WINDOWS_386_DIR}/etc
          cp ${APP_NAME}-windows-386.exe ${WINDOWS_386_DIR}/${APP_NAME}.exe
          cp etc/config.yaml.sample ${WINDOWS_386_DIR}/etc/config.yaml
          cp README.md ${WINDOWS_386_DIR}/ 2>/dev/null || true
          zip -r ${WINDOWS_386_DIR}.zip ${WINDOWS_386_DIR}

          # 清理临时目录
          echo "清理临时目录..."
          rm -rf ${LINUX_AMD64_DIR} ${LINUX_386_DIR} ${WINDOWS_AMD64_DIR} ${WINDOWS_386_DIR}

          # 生成校验和
          echo "生成校验和..."
          sha256sum *.tar.gz *.zip > checksums.txt

          echo "打包完成，最终文件："
          ls -la *.tar.gz *.zip checksums.txt

      - name: Create Launcher release packages
        run: |
          LAUNCHER_NAME="launcher"
          VERSION=${{ github.ref_name }}

          echo "创建 Launcher 发布包..."

          # Linux AMD64 Launcher 包
          echo "打包 Launcher Linux AMD64..."
          LINUX_AMD64_DIR="${LAUNCHER_NAME}-${VERSION}-linux-amd64"
          mkdir -p ${LINUX_AMD64_DIR}/etc
          cp ${LAUNCHER_NAME}-linux-amd64 ${LINUX_AMD64_DIR}/${LAUNCHER_NAME}
          cp etc/config.yaml.sample ${LINUX_AMD64_DIR}/etc/config.yaml.sample
          cp README.md ${LINUX_AMD64_DIR}/ 2>/dev/null || true
          tar -czf ${LINUX_AMD64_DIR}.tar.gz ${LINUX_AMD64_DIR}

          # Linux 386 Launcher 包
          echo "打包 Launcher Linux 386..."
          LINUX_386_DIR="${LAUNCHER_NAME}-${VERSION}-linux-386"
          mkdir -p ${LINUX_386_DIR}/etc
          cp ${LAUNCHER_NAME}-linux-386 ${LINUX_386_DIR}/${LAUNCHER_NAME}
          cp etc/config.yaml.sample ${LINUX_386_DIR}/etc/config.yaml.sample
          cp README.md ${LINUX_386_DIR}/ 2>/dev/null || true
          tar -czf ${LINUX_386_DIR}.tar.gz ${LINUX_386_DIR}

          # Windows AMD64 Launcher 包
          echo "打包 Launcher Windows AMD64..."
          WINDOWS_AMD64_DIR="${LAUNCHER_NAME}-${VERSION}-windows-amd64"
          mkdir -p ${WINDOWS_AMD64_DIR}/etc
          cp ${LAUNCHER_NAME}-windows-amd64.exe ${WINDOWS_AMD64_DIR}/${LAUNCHER_NAME}.exe
          cp etc/config.yaml.sample ${WINDOWS_AMD64_DIR}/etc/config.yaml.sample
          cp README.md ${WINDOWS_AMD64_DIR}/ 2>/dev/null || true
          zip -r ${WINDOWS_AMD64_DIR}.zip ${WINDOWS_AMD64_DIR}

          # Windows 386 Launcher 包
          echo "打包 Launcher Windows 386..."
          WINDOWS_386_DIR="${LAUNCHER_NAME}-${VERSION}-windows-386"
          mkdir -p ${WINDOWS_386_DIR}/etc
          cp ${LAUNCHER_NAME}-windows-386.exe ${WINDOWS_386_DIR}/${LAUNCHER_NAME}.exe
          cp etc/config.yaml.sample ${WINDOWS_386_DIR}/etc/config.yaml.sample
          cp README.md ${WINDOWS_386_DIR}/ 2>/dev/null || true
          zip -r ${WINDOWS_386_DIR}.zip ${WINDOWS_386_DIR}

          # 清理临时目录
          echo "清理临时目录..."
          rm -rf ${LINUX_AMD64_DIR} ${LINUX_386_DIR} ${WINDOWS_AMD64_DIR} ${WINDOWS_386_DIR}

          # 更新校验和
          echo "更新校验和..."
          sha256sum ${LAUNCHER_NAME}-*.tar.gz ${LAUNCHER_NAME}-*.zip >> checksums.txt

          echo "Launcher 打包完成，最终文件："
          ls -la ${LAUNCHER_NAME}-*.tar.gz ${LAUNCHER_NAME}-*.zip

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.tar.gz
            *.zip
            checksums.txt
          generate_release_notes: true
          body: |
            ## 🚀 版本 ${{ github.ref_name }}

            ### 📦 下载

            #### Linux
            - **Linux AMD64 (64位)**: `evm-grid-bot-${{ github.ref_name }}-linux-amd64.tar.gz`
            - **Linux 386 (32位)**: `evm-grid-bot-${{ github.ref_name }}-linux-386.tar.gz`

            #### Windows
            - **Windows AMD64 (64位)**: `evm-grid-bot-${{ github.ref_name }}-windows-amd64.zip`
            - **Windows 386 (32位)**: `evm-grid-bot-${{ github.ref_name }}-windows-386.zip`

            ### 🚀 启动器 (Launcher) - Windows 版本

            #### Windows
            - **Windows AMD64 (64位)**: `launcher-${{ github.ref_name }}-windows-amd64.zip`
            - **Windows 386 (32位)**: `launcher-${{ github.ref_name }}-windows-386.zip`

            ### 🔧 使用方法

            #### 使用启动器（推荐）
            1. 根据你的系统架构下载对应的 Launcher 压缩包
            2. 解压到目标目录
            3. 运行启动器：
               - Linux: `./launcher`
               - Windows: `./launcher.exe`
            4. 在启动器界面中配置并启动程序

            #### 直接运行程序
            1. 根据你的系统架构下载对应的压缩包
            2. 解压到目标目录
            3. 修改 `etc/config.yaml` 配置文件
            4. 运行可执行文件：
               - Linux: `./evm-grid-bot -f etc/config.yaml`
               - Windows: `./evm-grid-bot.exe -f etc/config.yaml`

            ### ⚠️ 注意事项
            - 本版本包含 SQLite 数据库支持
            - 如遇到权限问题，Linux 用户请使用 `chmod +x evm-grid-bot`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
